name: C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S "ATM Machine" -B "ATM Machine/build"

      - name: Build project
        run: cmake --build "ATM Machine/build"